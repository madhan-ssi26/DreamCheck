name: DreamCheck checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the bundled Dream Labs library
        run: python -m pip install ./dream_library
      - name: Check dependencies and run unit tests
        run: |
          python -m pip check
          python -m unittest discover -s dreamcheck -t . -v
      - name: Install Mesa software rendering
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6
      - name: Run the scripted MuJoCo reference
        if: runner.os == 'Linux'
        env:
          MUJOCO_GL: osmesa
        run: |
          python -m dreamcheck run --reference > reference.json
          python -c 'import json; run = json.load(open("reference.json")); assert run["verdict"] == "passed" and run.get("has_image"), run'
